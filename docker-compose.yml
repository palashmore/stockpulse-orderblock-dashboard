# docker compose up -d --build   then open http://localhost:3001
services:
  stockpulse:
    build: .
    ports:
      - "3001:3001"
    env_file: .env          # BREEZE_API_KEY, BREEZE_API_SECRET, NTFY_TOPIC ... (never commit this file)
    volumes:
      - stockpulse-data:/app/data   # saved alerts survive restarts
    restart: unless-stopped
volumes:
  stockpulse-data:
