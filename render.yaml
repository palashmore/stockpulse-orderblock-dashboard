# Render (https://render.com) Blueprint: New > Blueprint > pick this repository.
services:
  - type: web
    name: stockpulse
    runtime: node
    plan: starter            # a plan with a persistent disk is needed to keep saved alerts
    buildCommand: npm ci && VITE_API_BASE=/api npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    disk:
      name: stockpulse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALERTS_FILE
        value: /var/data/alerts.json
      - key: BREEZE_API_KEY
        sync: false          # you enter these in Render's dashboard; they are never stored in git
      - key: BREEZE_API_SECRET
        sync: false
      - key: NTFY_TOPIC
        sync: false
