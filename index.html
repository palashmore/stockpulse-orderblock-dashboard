<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockPulse" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StockPulse - Daily Market Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved day/night theme before the first paint, so there is no flash of the wrong colours
      try {
        var saved = JSON.parse(localStorage.getItem('stockpulse.settings.v1'));
        var pref = saved && saved.theme;
        var light = pref === 'day' || (pref === 'auto' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'day' : 'night');
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f1f5f9');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'night'); }
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0a0e17; }
      html[data-theme='day'], html[data-theme='day'] body, html[data-theme='day'] #root { background: #f1f5f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
